apiVersion: v2
name: secret-cycle
description: |
  Helm chart that deploys secret_cycle.py as a Kubernetes CronJob.
  The CronJob calls AWS Secrets Manager's rotate-secret API on a schedule,
  which triggers the configured Lambda rotation function.
  Use this chart when you want rotation to be driven from inside the cluster
  rather than from a Lambda function.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - aws
  - secrets-manager
  - secret-rotation
  - security
home: https://github.com/michaelmartone/secret-cycle
sources:
  - https://github.com/michaelmartone/secret-cycle
maintainers:
  - name: michaelmartone
